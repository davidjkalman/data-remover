# Data broker catalog.
#
# Fields:
#   key        - stable slug, used by the CLI
#   name       - display name
#   tier       - 1 = high impact (large index, feeds other sites), 2 = common, 3 = long tail
#   method     - form | email | account | mail   (primary removal channel)
#   optout_url - opt-out page (NOT the search page)
#   email      - privacy contact for statutory requests
#   requires   - hurdles you will hit: captcha, email_verify, sms_verify, id_upload, account, notarized
#   recheck_days - how often this one tends to re-list you
#   feeds      - other catalog keys that source data from this one; kill the parent first
#   notes      - anything that trips people up
#
# verified: false means the URL is from prior knowledge and has NOT been checked
# by this tool against the live site. Run `dr verify` to walk them.

brokers:
  # ---------- Tier 1: the aggregators everyone else copies ----------
  - key: acxiom
    name: Acxiom (LiveRamp)
    tier: 1
    method: form
    optout_url: https://isapps.acxiom.com/optout/optout.aspx
    email: privacy@acxiom.com
    requires: [email_verify]
    recheck_days: 365
    notes: >
      Wholesale supplier to marketing databases. Removing here reduces downstream
      re-listing more than any single people-search site.

  - key: lexisnexis
    name: LexisNexis Risk Solutions
    tier: 1
    method: form
    optout_url: https://optout.lexisnexis.com/
    email: privacy.information.manager@lexisnexis.com
    requires: [id_upload]
    recheck_days: 365
    notes: >
      FCRA-regulated. You have a right to your full consumer file (free) as well
      as suppression. Ask for the file first - it shows what they actually hold.

  - key: epsilon
    name: Epsilon (Publicis)
    tier: 1
    method: email
    optout_url: https://legal.epsilon.com/global-privacy-policies
    email: privacy@epsilon.com
    requires: []
    recheck_days: 365

  - key: oracle-datacloud
    name: Oracle Data Cloud / Advertising
    tier: 1
    method: email
    optout_url: https://www.oracle.com/legal/privacy/privacy-choices/
    email: privacy_ww@oracle.com
    requires: []
    recheck_days: 730
    notes: Oracle wound down its ad data business in 2024; request confirmation of deletion of legacy records.

  - key: thomson-reuters-clear
    name: Thomson Reuters CLEAR
    tier: 1
    method: form
    optout_url: https://www.thomsonreuters.com/en/privacy-statement
    email: privacy.issues@thomsonreuters.com
    requires: [id_upload]
    recheck_days: 365
    notes: >
      The CLEAR opt-out sits behind a rotating privacy-portal link that a link
      check cannot resolve. Email is the reliable channel here.

  - key: corelogic
    name: CoreLogic
    tier: 1
    method: email
    optout_url: https://www.cotality.com/legal/privacy-policy
    email: privacy@corelogic.com
    requires: []
    recheck_days: 365
    notes: >
      CoreLogic rebranded to Cotality in 2025 and the old privacy-center URL now
      404s. The linked policy page is a placeholder - the live request form was
      not locatable by link check. Use the email channel, or find the current
      form and fix this with `dr broker-set`.

  # ---------- Tier 1: people-search with the widest reach ----------
