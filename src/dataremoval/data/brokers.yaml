  # ---------- Marketing / credit suppression (free, high leverage) ----------
  - key: optoutprescreen
    name: OptOutPrescreen (credit bureaus)
    tier: 1
    method: form
    optout_url: https://www.optoutprescreen.com/
    email: null
    requires: []
    recheck_days: 1825
    notes: >
      Official joint bureau site. Online = 5 years; the mailed form = permanent.
      Stops prescreened credit/insurance offers, which are a major mail-data leak.

  - key: dmachoice
    name: DMAchoice (ANA)
    tier: 2
    method: account
    optout_url: https://www.dmachoice.org/
    email: null
    requires: [account]
    recheck_days: 1095
    notes: Small processing fee. Covers a large slice of direct-mail list rental.

  - key: ca-drop
    name: California DROP (DELETE Act)
    tier: 1
    method: account
    optout_url: https://cppa.ca.gov/
    email: null
    requires: [account, id_upload]
    recheck_days: 365
    notes: >
      California's one-stop deletion mechanism. Registered brokers must check the
      list and honor deletions on a recurring basis. CA residents: do this first,
      it does the most work per unit of effort.
